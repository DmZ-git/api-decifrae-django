services:
  - type: web
    name: api-decifrae
    plan: starter
    runtime: python
    runtimeVersion: 3.11
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn api.core.wsgi:application --bind 0.0.0.0:${PORT}
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: "8000"
