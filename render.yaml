services:
  - type: web
    name: django-backend
    env: python
    plan: free
    pythonVersion: 3.13
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python app.py migrate
    startCommand: gunicorn api.core.wsgi:application --bind 0.0.0.0:10000 --workers 1 --timeout 120