services:
  - type: web
    name: django-backend
    env: python
    plan: free
    pythonVersion: 3.13
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python app.py migrate
    startCommand: gunicorn api.core.wsgi:application --bind 0.0.0.0:10000 --workers 2 --worker-class sync --timeout 30 --max-requests 100 --max-requests-jitter 10
    envVars:
      - key: GUNICORN_CMD_ARGS
        value: --workers=2 --timeout=30 --max-requests=100
  
  # Background worker para processar áudio de forma assíncrona
  - type: background_worker
    name: celery-worker-audio
    env: python
    pythonVersion: 3.13
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    # Otimizações críticas para memória:
    # --concurrency=1: Apenas 1 worker por vez (evita múltiplos processos de áudio)
    # --max-tasks-per-child=10: Reinicia após 10 tarefas (libera memória acumulada)
    # --max-memory-per-child=400000: Reinicia se usar mais de 400MB (Free tier = 512MB)
    # -O fair: Distribui tarefas de forma justa
    # --without-gossip --without-mingle --without-heartbeat: Reduz overhead
    startCommand: celery -A api worker -l info --concurrency=1 --max-tasks-per-child=10 --max-memory-per-child=400000 -O fair --without-gossip --without-mingle --without-heartbeat
    envVars:
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: redis-cache
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: redis-cache
          property: connectionString
      - key: CELERYD_MAX_TASKS_PER_CHILD
      envVars:
        - key: CELERYD_MAX_TASKS_PER_CHILD
        value: "10"
      - key: CELERYD_TASK_SOFT_TIME_LIMIT
        value: "300"  # 5 minutos
      - key: CELERYD_TASK_TIME_LIMIT
        value: "360"  # 6 minutos (hard limit)


  # Redis agora é OPCIONAL
  # Se Redis não estiver disponível, o Celery faz fallback automático para database backend
  # Consulte api/core/settings.py para a lógica de fallback
  # 
  # Para adicionar Redis em produção, descomente:
  # databases:
  #   - name: redis-cache
  #     engine: redis
  #     plan: free
